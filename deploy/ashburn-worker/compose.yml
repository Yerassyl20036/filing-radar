# Ashburn-1: the worker, which polls EDGAR. Postgres
# (Frankfurt) and Temporal (Ashburn-2) are reached through two SSH tunnels, so
# neither server has to open a database port to the internet.
name: radar-worker

services:
  pg-tunnel:
    image: ${TUNNEL_IMAGE:?}:${TAG:?}
    restart: unless-stopped
    command: ["-L", "0.0.0.0:5432:127.0.0.1:5432", "tunnel@${FRANKFURT_HOST:?}"]
    volumes: ["./keys:/keys:ro"]
    mem_limit: 32m

  temporal-tunnel:
    image: ${TUNNEL_IMAGE:?}:${TAG:?}
    restart: unless-stopped
    command: ["-L", "0.0.0.0:7233:127.0.0.1:7233", "tunnel@${TEMPORAL_HOST:?}"]
    volumes: ["./keys:/keys:ro"]
    mem_limit: 32m

  worker:
    image: ${IMAGE:?}:${TAG:?}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD:?}@pg-tunnel:5432/radar?sslmode=disable
      TEMPORAL_ADDRESS: temporal-tunnel:7233
      SERVER_NAME: ashburn-1
      TEMPORAL_SERVER_NAME: ashburn-2
      # SEC requires a name and contact email; it's a secret so the email
      # stays out of the public repo and the logs.
      EDGAR_USER_AGENT: ${EDGAR_USER_AGENT:?}
      # Stage 2b: a language model scores 8-Ks, DeepSeek or Claude, whichever
      # key is set (TRIAGE_PROVIDER can name one). Without a key the rules
      # decide alone. An empty TRIAGE_MODEL means the provider's default.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-}
      TRIAGE_MODEL_DAILY_CAP: ${TRIAGE_MODEL_DAILY_CAP:-200}
      # Stage 3: the same model writes notes on high 8-Ks. The budget is in
      # US$ per UTC day and covers scores and notes together; the DeepSeek
      # balance is prepaid, so it must hold. Prices override the preset's.
      MODEL_DAILY_BUDGET_USD: ${MODEL_DAILY_BUDGET_USD:-0.20}
      ANALYST_DAILY_CAP: ${ANALYST_DAILY_CAP:-30}
      MODEL_PRICE_IN_PER_M: ${MODEL_PRICE_IN_PER_M:-}
      MODEL_PRICE_OUT_PER_M: ${MODEL_PRICE_OUT_PER_M:-}
    depends_on: [pg-tunnel, temporal-tunnel]
    mem_limit: 128m
