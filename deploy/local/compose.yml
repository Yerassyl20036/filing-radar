# Everything on your laptop, without tunnels:
#   export EDGAR_USER_AGENT="Filing Radar you@example.com"
#   docker compose -f deploy/local/compose.yml up --build
# then open http://localhost:8088. Without EDGAR_USER_AGENT the site runs and
# the status page says the ingestor is waiting for it. To try the model step,
# put ANTHROPIC_API_KEY=... in deploy/local/.env (git ignores it); compose
# reads it from there. Locally the model is capped at 20 calls a day.
name: radar-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 3s
      retries: 20

  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]

  web:
    build: ../..
    environment:
      DATABASE_URL: postgres://radar:radar@postgres:5432/radar?sslmode=disable
      SERVER_NAME: frankfurt-1
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ../..
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      DATABASE_URL: postgres://radar:radar@postgres:5432/radar?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
      SERVER_NAME: ashburn-1
      TEMPORAL_SERVER_NAME: ashburn-2
      EDGAR_USER_AGENT: ${EDGAR_USER_AGENT:-}
      EDGAR_BASE_URL: ${EDGAR_BASE_URL:-https://www.sec.gov}
      EDGAR_DATA_URL: ${EDGAR_DATA_URL:-https://data.sec.gov}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-claude-opus-5-5}
      TRIAGE_MODEL_DAILY_CAP: ${TRIAGE_MODEL_DAILY_CAP:-20}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
